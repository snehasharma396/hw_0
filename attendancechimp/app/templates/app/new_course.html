<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Course</title>
</head>
<body style="font-family: Arial, sans-serif; text-align: center;">
    <h1>Create Course</h1>

    <form method="post" action="/app/createCourse">
        {% csrf_token %}

        <p>
            <label>
                Course name:
                <input name="course-name" type="text"
                       maxlength="200" required>
            </label>
        </p>

        <p>
            <label>
                Start time:
                <input name="start-time" type="time" required>
            </label>
        </p>

        <p>
            <label>
                End time:
                <input name="end-time" type="time" required>
            </label>
        </p>

        <fieldset>
            <legend>Meeting days</legend>
            <label><input type="checkbox" name="day-mon"> Monday</label>
            <label><input type="checkbox" name="day-tue"> Tuesday</label>
            <label><input type="checkbox" name="day-wed"> Wednesday</label>
            <label><input type="checkbox" name="day-thu"> Thursday</label>
            <label><input type="checkbox" name="day-fri"> Friday</label>
        </fieldset>

        <p><button type="submit">Create Course</button></p>
    </form>
</body>
</html>
